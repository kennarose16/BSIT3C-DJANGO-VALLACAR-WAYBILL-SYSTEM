{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>
    Sign in - Waybill
  </title>
  <link href="{% static 'libs/jsvectormap/dist/jsvectormap.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler-flags.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler-socials.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler-payments.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler-vendors.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler-marketing.css' %}" rel="stylesheet" />
  <link href="{% static 'css/tabler-themes.css' %}" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    html,
    body.auth-login {
      min-height: 100%;
    }

    body.auth-login {
      min-height: 100vh;
      margin: 0;
      background: #1e0f32;
    }

    body.auth-login::before {
      position: fixed;
      z-index: 0;
      inset: 0;
      content: "";
      background-image: linear-gradient(rgba(30, 15, 50, 0.72), rgba(30, 15, 50, 0.72)), url("https://i.pinimg.com/736x/e2/97/c5/e297c5b1aa4147fe43798f6c348563d8.jpg");
      background-position: center;
      background-size: cover;
    }

    body.auth-login .page.page-center {
      position: relative;
      z-index: 1;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: transparent;
    }

    .auth-login .container-tight {
      width: min(100%, 27rem);
      padding: 0 !important;
    }

    .auth-login .card {
      overflow: hidden;
      border: 0;
      border-radius: 0.75rem;
      background: #fff;
      box-shadow: 0 1.5rem 4rem rgba(12, 5, 24, 0.32);
    }

    .auth-login .card-body {
      padding: 2rem;
    }

    .auth-login .auth-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      margin-bottom: 1.5rem;
      color: #28143d;
      font-size: 1.4rem;
      font-weight: 750;
    }

    .auth-login .auth-brand-icon {
      display: inline-grid;
      width: 2.5rem;
      height: 2.5rem;
      place-items: center;
      border-radius: 0.6rem;
      color: #fff;
      background: #4b2675;
    }

    .auth-login .form-label {
      color: #342741;
      font-weight: 600;
    }

    .auth-login .form-control:focus {
      border-color: #704b9c;
      box-shadow: 0 0 0 0.2rem rgba(75, 38, 117, 0.16);
    }

    .auth-login .btn-primary {
      width: 100%;
      border-color: #4b2675;
      color: #fff;
      background: #4b2675;
      background-image: none;
      box-shadow: none;
    }

    .auth-login .btn-primary:hover,
    .auth-login .btn-primary:focus-visible {
      border-color: #351750;
      background: #351750;
    }

    .auth-login .form-footer {
      margin-top: 1.25rem;
    }

    .auth-login .settings {
      display: none;
    }

    @media (max-width: 480px) {
      .auth-login .card-body {
        padding: 1.5rem;
      }
    }
  </style>
</head>

<body class="auth-login">
  <script src="{% static 'js/tabler-theme.js' %}"></script>
  <div class="page page-center">
    <div class="container container-tight py-4">

     <div class="card card-md">
      <div class="card-body">

        <div class="auth-brand">
          <span class="auth-brand-icon"><i class="fas fa-bus"></i></span>
          <span>Waybill</span>
        </div>
        <h2 class="h3 text-center mb-4">Sign in to start your session</h2>

        <form method="post">
          {% csrf_token %}

          {% if messages %}
          {% for message in messages %}
          <div id="error-message" class="alert alert-danger">
            {{ message }}
          </div>
          {% endfor %}
          {% endif %}
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" name="username" autocomplete="off" {% if locked %}disabled{% endif %}>
          </div>
          <div class="mb-2">
            <label class="form-label">
              Password
            </label>
            <div class="input-group input-group-flat">
              <input type="password" class="form-control" name="password" autocomplete="off" {% if locked %}disabled{% endif %}>
            </div>
          </div>
          <div class="form-footer d-flex justify-content-end">
            <button type="submit" class="btn btn-primary w-50">
              <i class="fas fa-sign-in-alt me-1"></i> Sign in
            </button>
          </div>
       </form>
     </div>
   </div>
 </div>
 <!-- <div class="text-center text-secondary mt-n1">
  Don't have an account?
  <a href="{% url 'register' %}" class="text-primary fw-bold">Register</a>
 </div> -->
</div>

{% include 'theme/settings.html' %}

<script src="{% static 'js/tabler.js' %}" defer></script>
<script src="{% static 'js/demo.js' %}" defer></script>
{% if locked %}
<script>
  let remaining = {{ remaining }};
  const messageBox = document.getElementById("error-message");

  let interval = setInterval(function() {
    remaining--;

    if (remaining > 0) {
      messageBox.innerHTML =
      "Too many failed attempts. Try again in " + remaining + " seconds.";
    } else {
      clearInterval(interval);
      window.location.href = "{% url 'login' %}";
    }

  }, 1000);
</script>
{% endif %}
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var themeConfig = {
      theme: "light",
      "theme-base": "gray",
      "theme-font": "sans-serif",
      "theme-primary": "blue",
      "theme-radius": "1",
    };

    var url = new URL(window.location);
    var form = document.getElementById("offcanvasSettings");
    var resetButton = document.getElementById("reset-changes");

    var checkItems = function () {
      for (var key in themeConfig) {
        var value =
        window.localStorage["tabler-" + key] || themeConfig[key];

        if (!!value) {
          var radios = form.querySelectorAll(`[name="${key}"]`);

          if (!!radios) {
            radios.forEach((radio) => {
              radio.checked = radio.value === value;
            });
          }
        }
      }
    };

    form.addEventListener("change", function (event) {
      var target = event.target,
      name = target.name,
      value = target.value;

      for (var key in themeConfig) {
        if (name === key) {
          document.documentElement.setAttribute("data-bs-" + key, value);
          window.localStorage.setItem("tabler-" + key, value);
          url.searchParams.set(key, value);
        }
      }

      window.history.pushState({}, "", url);
    });

    resetButton.addEventListener("click", function () {
      for (var key in themeConfig) {
        var value = themeConfig[key];
        document.documentElement.removeAttribute("data-bs-" + key);
        window.localStorage.removeItem("tabler-" + key);
        url.searchParams.delete(key);
      }

      checkItems();

      window.history.pushState({}, "", url);
    });

    checkItems();
  });
</script>
</body>
</html>
