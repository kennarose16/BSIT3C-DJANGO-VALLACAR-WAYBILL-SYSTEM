{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{% block title %}Password reset - Waybill{% endblock %}</title>
  <link href="{% static 'css/tabler.css' %}" rel="stylesheet" />
  <link href="{% static 'css/app-theme.css' %}" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    html, body.auth-login { min-height: 100%; }
    body.auth-login { min-height: 100vh; margin: 0; background: #1e0f32; }
    body.auth-login::before {
      position: fixed; z-index: 0; inset: 0; content: "";
      background-image: linear-gradient(rgba(30, 15, 50, 0.72), rgba(30, 15, 50, 0.72)), url("https://i.pinimg.com/736x/e2/97/c5/e297c5b1aa4147fe43798f6c348563d8.jpg");
      background-position: center; background-size: cover;
    }
    .auth-login .page-center { position: relative; z-index: 1; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 1.5rem; background: transparent; }
    .auth-login .container-tight { width: min(100%, 27rem); padding: 0; }
    .auth-login .card { border: 0; border-radius: 0.75rem; background: #fff; box-shadow: 0 1.5rem 4rem rgba(12, 5, 24, 0.32); }
    .auth-login .card-body { padding: 2rem; }
    .auth-brand { display: flex; align-items: center; justify-content: center; gap: 0.7rem; margin-bottom: 1.5rem; color: #28143d; font-size: 1.4rem; font-weight: 750; }
    .auth-brand-icon { display: inline-grid; width: 2.5rem; height: 2.5rem; place-items: center; border-radius: 0.6rem; color: #fff; background: #4b2675; }
    .auth-login .form-label { color: #342741; font-weight: 600; }
    .auth-login input[type=email], .auth-login input[type=password] { display: block; width: 100%; padding: 0.55rem 0.75rem; border: 1px solid #d5d9e0; border-radius: 0.375rem; }
    .auth-login input:focus { border-color: #704b9c; outline: 0; box-shadow: 0 0 0 0.2rem rgba(75, 38, 117, 0.16); }
    .auth-login .btn-primary { width: 100%; border-color: #4b2675; color: #fff; background: #4b2675; background-image: none; box-shadow: none; }
    .auth-login .btn-primary:hover { border-color: #351750; background: #351750; }
    .auth-login .settings { display: none; }
    @media (max-width: 480px) { .auth-login .card-body { padding: 1.5rem; } }
  </style>
</head>
<body class="auth-login">
  <div class="page page-center">
    <div class="container container-tight py-4">
      <div class="card"><div class="card-body">
        <div class="auth-brand"><span class="auth-brand-icon"><i class="fas fa-bus"></i></span><span>Waybill</span></div>
        {% block card_content %}{% endblock %}
      </div></div>
    </div>
  </div>
</body>
</html>
